name: CI/CD — Deploy Acolher.life

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validar Sintaxe (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de sintaxe (node --check)
        run: |
          node --check server.js
          node --check routes/admin.js
          node --check routes/location.js
          node --check middleware/auth.js
          node --check utils/geocode.js

  deploy:
    name: Deploy na VPS via Docker (CD)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Acessar VPS e atualizar container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /home/acolher/htdocs/acolher.life

            # Backup automático preventivo se o container do banco já estiver rodando
            if docker ps --format '{{.Names}}' | grep -q "^acolher-db$"; then
              mkdir -p /home/acolher/backups
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              docker exec acolher-db sh -c 'exec mysqldump --no-tablespaces -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' > /home/acolher/backups/db_pre_deploy_$TIMESTAMP.sql
              ls -1t /home/acolher/backups/db_pre_deploy_*.sql | tail -n +11 | xargs -r rm --
            fi

            # Atualiza o código a partir da branch main
            git fetch origin main
            git reset --hard origin/main

            # Se o processo legado do PM2 ainda existir, para e remove
            if command -v pm2 >/dev/null 2>&1 && pm2 describe acolher.life >/dev/null 2>&1; then
              pm2 stop acolher.life
              pm2 delete acolher.life
              pm2 save
            fi

            # Sobe/atualiza os containers
            docker compose up -d --build --remove-orphans

            # Limpa imagens antigas sem uso
            docker image prune -f