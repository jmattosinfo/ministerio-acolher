name: acolher

services:
  db:
    image: mysql:8.4.0
    container_name: acolher-db
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=256M"]
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - acolher-net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  acolher-app:
    build: .
    container_name: acolher-life
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      NODE_ENV: production
      TZ: America/Sao_Paulo
    init: true
    mem_limit: 384m
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - acolher-net

volumes:
  mysql_data:
    name: acolher_mysql_data

networks:
  acolher-net:
    driver: bridge